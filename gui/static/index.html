<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaneSense - Crop Disease Detection</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/mpegts.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M27 4C14 4 5 10.5 5 20.5c0 2.8.9 5 2.7 7 1.2-6.4 5.3-11.8 12.8-14.8-5.5 4.2-8.8 8.6-10 14.8 1.1.3 2.2.5 3.3.5 8.6 0 14.5-8.4 13.2-24z"/>
      <path class="rib" d="M8 27C11 18 17 12.5 24 9.5"/>
    </svg>
    <div><h1>Cane<span>Sense</span></h1>
    <div class="tagline">Sugarcane disease detection at the edge &middot; private 5G</div></div>
  </div>
  <div class="global">
    <button id="startAll" class="btn go">Start stack</button>
    <button id="stopAll" class="btn stop">Stop stack</button>
    <span id="clock"></span>
  </div>
</header>

<main>
  <section class="topo-wrap">
    <h2>5G path</h2>
    <svg id="topo" viewBox="-6 0 992 88" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <div class="grid">
    <section class="feed-card">
      <h2>Field view <span class="tag">plants under watch &middot; camera over 5G, received at the edge</span></h2>
      <video id="video" muted autoplay playsinline></video>
      <div class="feed-controls">
        <button id="playFeed" class="btn go">Play feed</button>
        <span id="feedStatus" class="muted">idle</span>
      </div>
    </section>

    <section class="status-card">
      <h2>Pipeline</h2>
      <div id="components"></div>
    </section>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
